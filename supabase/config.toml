# Supabase CLI configuration for local development.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file contains no secrets. Local keys are generated by `supabase start`.
# The hosted project's settings (auth providers, API settings) are NOT read
# from this file; mirror the important ones by hand (see supabase/README.md).

project_id = "gabay-ni-juan"

[api]
enabled = true
port = 54321
# `private` (role/audit helper functions) is deliberately NOT exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Matches the hosted project (PostgreSQL 17).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Fictional development data only (generated from the app fixtures).
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
# Voters do not have accounts. Staff are invited; public sign-up stays off.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
